name: Test

# The workflow name stays `Test`: signal auto-close in user-base matches a
# green run of this same workflow (extension/github-actions/lib/emit-failures.mjs).

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      # No dependency lifecycle script runs: package.json carries an empty
      # trustedDependencies, and --ignore-scripts covers the root package too.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Protocol-bound subprocesses (spec section 6). The audio-pipeline
      # conformance vector lands with the single-peer stage.
      - name: Install ffmpeg and fpcalc
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libchromaprint-tools

      - name: Verify (lint and typecheck)
        run: bun run verify

      - name: Test
        run: bun test
