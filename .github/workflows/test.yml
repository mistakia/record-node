name: Test

on:
  push:
  # Manual re-runs. The workflow was found manually disabled with only a stale
  # failed run behind it (2025-12-13, logs long since 410'd), which is how a
  # master that has shipped five CI-hardening commits since still reads red.
  # workflow_dispatch is what keeps a re-enabled Test workflow re-runnable
  # without a throwaway push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Yarn install
        run: |
          yarn install --frozen-lockfile --network-timeout 300000

      - name: Install ffmpeg & chromaprint
        run: |
          sudo apt-get install software-properties-common
          sudo add-apt-repository -y ppa:savoury1/ffmpeg4
          sudo apt-get update
          sudo apt-get install libchromaprint-tools ffmpeg

      - name: Test & Lint
        run: |
          yarn lint
          yarn test

  # 'NODE_ENV' is not recognized as an internal or external command
  # windows:
  #   runs-on: windows-latest
  #   steps:
  #     - name: Check out Git repository
  #       uses: actions/checkout@v1

  #     - name: Install Node.js, NPM and Yarn
  #       uses: actions/setup-node@v1
  #       with:
