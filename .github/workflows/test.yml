name: Test

# The workflow name stays `Test`: signal auto-close in user-base matches a
# green run of this same workflow (extension/github-actions/lib/emit-failures.mjs).

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      # No dependency lifecycle script runs: package.json carries an empty
      # trustedDependencies, and --ignore-scripts covers the root package too.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Protocol-bound subprocesses (spec section 6), at the versions the F7
      # vectors were produced with: ffmpeg 7.1.1 and fpcalc 1.5.1. Distro
      # packages carry other versions, so both come from pinned artifacts:
      # ffmpeg from the static image by digest, fpcalc from the Chromaprint
      # release by checksum. The test suite's preflight refuses anything else.
      - name: Install pinned ffmpeg and fpcalc
        env:
          FFMPEG_IMAGE: mwader/static-ffmpeg:7.1.1@sha256:11a44711684c0b9f754c047dcd64235b8b52deab251bd0e0a86f22faa160749c
          FPCALC_URL: https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-linux-x86_64.tar.gz
          FPCALC_SHA256: 4d7433a7f778e5946d7225230681cbcd634e153316ecac87c538c33ac32387a5
        run: |
          bin="$RUNNER_TEMP/audio-tools"
          mkdir -p "$bin"
          container=$(docker create "$FFMPEG_IMAGE")
          docker cp "$container:/ffmpeg" "$bin/ffmpeg"
          docker rm "$container"
          curl -fsSL "$FPCALC_URL" -o "$RUNNER_TEMP/fpcalc.tar.gz"
          echo "$FPCALC_SHA256  $RUNNER_TEMP/fpcalc.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/fpcalc.tar.gz" -C "$bin" --strip-components=1 chromaprint-fpcalc-1.5.1-linux-x86_64/fpcalc
          echo "$bin" >> "$GITHUB_PATH"

      - name: Show audio tool versions
        run: |
          command -v ffmpeg fpcalc
          ffmpeg -version | head -n 1
          fpcalc -version

      - name: Verify (lint, typecheck, and dist/ current)
        run: bun run verify

      # No RECORD_TOOLCHAIN_PREFLIGHT bypass: the F7 audio-pipeline tests run
      # against the pinned binaries and fail on any other version.
      - name: Test
        run: bun test

      # record-app runs the node under Node, as a child process spawned through
      # Electron's utilityProcess (spec §8.3.1), so the ingest path must run
      # under Node as well as Bun.
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1

      - name: Ingest smoke under Node
        run: node test/smoke/ingest-node.ts

      # Under Node, OpenSSL verifies signatures, which bun test never runs.
      - name: Signature smoke under Node
        run: node test/smoke/signature-node.ts

      # record-app installs record-node as a git dependency with install
      # scripts off, so the committed dist/ and its # aliases must load from
      # node_modules under plain Node: install this commit that way, create a
      # peer, and ingest the F7 file.
      - name: Git-dependency smoke under Node
        run: sh test/smoke/git-dependency.sh "$GITHUB_SHA"
