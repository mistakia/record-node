  #     - name: Yarn install
  #       run: |
  #         yarn install --frozen-lockfile --network-timeout 300000

  #     - name: Install ffmpeg & chromaprint
  #       run: |
  #         choco install ffmpeg chromaprint

  #     - name: Test & Lint
  #       run: |
  #         yarn lint
  #         yarn test

  mac:
    runs-on: macos-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Yarn install
        run: |
          yarn install --frozen-lockfile --network-timeout 300000

      # ffmpeg comes from brew alongside chromaprint rather than from
      # FedericoCarboni/setup-ffmpeg. That action asserts `only x64 is
      # supported` and `macos-latest` has been arm64 since macos-14, so the
      # pinned v3.1 aborts the job before a single test runs. brew serves
      # whichever architecture the runner is, needs no token, and drops a
      # third-party action from the supply chain -- the direction the rest of
      # this workflow's pinning already goes.
      - name: Install ffmpeg & chromaprint
        run: |
          brew install ffmpeg chromaprint

      - name: Test & Lint
        run: |
          yarn lint
          yarn test
